# Paths are relative to this sonar-project.properties file.
sonar.sources=Assets/Scripts/PluginInterface,Assets/Scripts/VolumeData/VolumeDataSet.cs,Assets/Scripts/VolumeData/VolumeDataSetRenderer.cs,Assets/Scripts/Tools/Delegates.cs,Assets/Scripts/Tools/BenchmarkManager.cs,Assets/Scripts/VolumeData/Config.cs,docs/architecture,docs/adr,ci,.github/workflows

# Keep scanner focused on source/docs/CI text files.
