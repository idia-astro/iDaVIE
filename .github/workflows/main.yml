name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Repository smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Validate Unity project layout
        run: |
          set -euo pipefail

          test -d Assets
          test -d Assets/Scripts
          test -d ProjectSettings
          test -f ProjectSettings/ProjectVersion.txt
          test -d native_plugins_cmake
          find Assets/Scripts -name '*.cs' -print -quit | grep -q .
