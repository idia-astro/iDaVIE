name: SonarQube analysis

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION || 'epic-team-beta' }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'EPIC-Team-Beta_iDaVIE' }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Check SonarCloud configuration
        run: |
          set -euo pipefail

          : "${SONAR_TOKEN:?Missing SONAR_TOKEN repository secret}"

          case "${SONAR_HOST_URL}" in
            http://*|https://*) ;;
            *)
              echo "::error::SONAR_HOST_URL must start with http:// or https://"
              exit 1
              ;;
          esac

          echo "Using Sonar host: ${SONAR_HOST_URL}"
          echo "Using Sonar organization: ${SONAR_ORGANIZATION}"
          echo "Using Sonar project key: ${SONAR_PROJECT_KEY}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate SonarCloud token
        run: |
          set -euo pipefail

          auth_response="$(curl -fsS --retry 3 --retry-delay 5 --retry-connrefused --connect-timeout 10 \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL%/}/api/authentication/validate")"

          echo "${auth_response}"
          if ! echo "${auth_response}" | grep -q '"valid"[[:space:]]*:[[:space:]]*true'; then
            echo "::error::SONAR_TOKEN is present but SonarCloud did not accept it."
            exit 1
          fi

      - name: Inspect SonarCloud token scope
        run: |
          set -euo pipefail

          echo "Organizations visible to this token:"
          if curl -fsS --retry 3 --retry-delay 5 --retry-connrefused --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --get "${SONAR_HOST_URL%/}/api/organizations/search" \
            --data-urlencode "member=true" > sonar-organizations.json; then
            cat sonar-organizations.json
          else
            echo "::warning::Could not list organizations for this token."
          fi

          echo "Projects visible under '${SONAR_ORGANIZATION}':"
          if curl -fsS --retry 3 --retry-delay 5 --retry-connrefused --connect-timeout 10 --max-time 20 \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --get "${SONAR_HOST_URL%/}/api/projects/search" \
            --data-urlencode "organization=${SONAR_ORGANIZATION}" > sonar-projects.json; then
            cat sonar-projects.json
          else
            echo "::warning::Could not list projects for organization '${SONAR_ORGANIZATION}'."
          fi

      - name: Validate SonarCloud project key
        run: |
          set -euo pipefail

          candidates="$(
            printf '%s\n' \
              "${SONAR_PROJECT_KEY}" \
              "EPIC-Team-Beta_iDaVIE" \
              "epic-team-beta_iDaVIE" \
              "EPIC-Team-Beta_idavie" \
              "epic-team-beta_idavie" \
              | awk 'NF && !seen[$0]++'
          )"

          echo "Probing likely SonarCloud project keys:"
          while IFS= read -r candidate; do
            status="$(curl -sS --retry 3 --retry-delay 5 --retry-connrefused --connect-timeout 10 --max-time 20 \
              --header "Authorization: Bearer ${SONAR_TOKEN}" \
              --get "${SONAR_HOST_URL%/}/api/components/show" \
              --data-urlencode "component=${candidate}" \
              --output sonar-project-api.json \
              --write-out "%{http_code}")"

            echo "  ${candidate}: HTTP ${status}"

            if [ "${status}" = "200" ]; then
              echo "Resolved SonarCloud project key: ${candidate}"
              echo "SONAR_PROJECT_KEY=${candidate}" >> "${GITHUB_ENV}"
              cat sonar-project-api.json
              exit 0
            fi
          done <<EOF
          ${candidates}
          EOF

          echo "::error::Could not find a SonarCloud project for EPIC-Team-Beta/iDaVIE visible to this token. Import EPIC-Team-Beta/iDaVIE into the EPIC SonarCloud org, then set SONAR_PROJECT_KEY/SONAR_ORGANIZATION from that project."
          exit 1

      - name: Create SonarQube scanner config
        run: |
          set -euo pipefail

          {
            echo "sonar.projectKey=${SONAR_PROJECT_KEY}"
            echo "sonar.organization=${SONAR_ORGANIZATION}"
            echo "sonar.projectName=iDaVIE"
            echo "sonar.sources=Assets/Scripts,native_plugins_cmake"
            echo "sonar.exclusions=**/*.meta,**/Library/**,**/Temp/**,**/Obj/**,**/Build/**,**/Logs/**"
            echo "sonar.sourceEncoding=UTF-8"
          } > sonar-project.properties

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
